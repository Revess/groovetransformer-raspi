[Defaults]
# --- STARTUP VALUES ---
# These are applied when the script starts.

# Global
interpolate = 0.0
follow = 1.0
density = 0.5
temperature = 1.0
shift = 0

# Velocity Scaling (0.0 to 1.0)
# Kicks/Snares usually max volume. Hats/Cymbals slightly lower for "groove".
vel_kick = 0.7
vel_snare = 0.7
vel_clhat = 0.85
vel_ophat = 0.85
vel_lotom = 0.95
vel_midtom = 0.95
vel_hightom = 0.95
vel_crash = 0.80
vel_ride = 0.80

# Thresholds (0.0 to 1.0)
# 0.5 = Standard. 
# Lower (0.3-0.4) = Triggers more "ghost notes". 
# Higher (0.6-0.7) = Only plays the most confident hits.
thresh_kick = 0.5
thresh_snare = 0.5
thresh_clhat = 0.35
thresh_ophat = 0.5
thresh_lotom = 0.5
thresh_midtom = 0.5
thresh_hightom = 0.5
thresh_crash = 0.6
thresh_ride = 0.4

# Max Counts (0 to 32)
# Limits how many times a voice can trigger in 2 bars.
max_kick = 32
max_snare = 32
max_clhat = 32
max_ophat = 32
max_lotom = 32
max_midtom = 32
max_hightom = 32
max_crash = 32
max_ride = 32

[Network]
dest_ip = 127.0.0.1
dest_port = 9000
osc_port = 9001

[MIDI]
in_port = GrooveSender_Input

[VoiceMap]
Kick = 36
Snare = 38
ClHat = 42
OpHat = 46
LoTom = 41
MidTom = 48
HiTom = 45
Crash = 49
Ride = 51

[CC_Map]
# GLOBAL CONTROLS
1 = interpolate
2 = follow
3 = density
4 = temperature
5 = shift

# TRIGGERS (Value > 64)
10 = regenerate_A
11 = regenerate_B
12 = reset

# VELOCITY SCALING
20 = vel_kick
21 = vel_snare
22 = vel_clhat
23 = vel_ophat
24 = vel_lotom
25 = vel_midtom
26 = vel_hightom
27 = vel_crash
28 = vel_ride

# THRESHOLDS
30 = thresh_kick
31 = thresh_snare
32 = thresh_clhat
33 = thresh_ophat
34 = thresh_lotom
35 = thresh_midtom
36 = thresh_hightom
37 = thresh_crash
38 = thresh_ride

# MAX COUNTS
40 = max_kick
41 = max_snare
42 = max_clhat
43 = max_ophat
44 = max_lotom
45 = max_midtom
46 = max_hightom
47 = max_crash
48 = max_ride